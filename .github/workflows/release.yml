# SPDX-License-Identifier: BSD-3-Clause
# Build the SGI release archives for Linux, Windows and macOS with
# packaging/sgi-package.py, and publish them as a GitHub Release.
#
# This runs on github.com only, which holds the public mirror. Forgejo reads
# this directory too, so every job carries the same guard as the other
# workflows, inverted.
#
#   tag sgi-origami-*     build all three, then publish a Release; the Release
#                         is created as a draft and published only once the
#                         archives and checksums are attached
#   push to sgi-origami   packaging check: build all three, publish nothing
#   weekly                same check, to catch drift in the runners' tools
#   manual dispatch       same check, on the chosen ref
name: Build and release QEMU archives (Linux, Windows, macOS)

on:
  push:
    # GitHub applies the paths filter to branch pushes only; a tag push
    # ignores it, so a tag always starts a release build.
    tags: ["sgi-origami-*"]
    branches: [sgi-origami]
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Set only for a tag push; the other runs build development archives.
  RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sgi-origami-') && github.ref_name || '' }}
  # The Rust toolchain of the archives. The GPU library needs 1.94 or newer,
  # and a release should not move with whatever is current.
  RUST_VERSION: "1.94.1"

jobs:
  linux:
    name: Build Linux archive
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: cache vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-package/vcpkg-binary-cache
          key: vcpkg-linux-${{ hashFiles('packaging/vcpkg.json', 'packaging/vcpkg-commit', 'packaging/debian-bookworm.docker') }}
      - name: build the packaging image
        run: docker build -t sgi-package -f packaging/debian-bookworm.docker packaging
      - name: build the archive
        run: |
          mkdir -p build-package
          docker run --rm -e RELEASE_TAG -v "$PWD":/src -w /src sgi-package sh -ec '
            git config --global --add safe.directory /src
            python3 packaging/sgi-package.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
          ' sh
      - name: run the archive in a bare container
        # Only the libraries the archive documents as the host's to provide
        # are installed, so a missing bundled library shows up here.
        run: |
          archive=$(ls build-package/dist/*.tar.gz)
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          docker run --rm -v "$PWD/unpacked":/sgi:ro debian:bookworm-slim sh -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
                libx11-6 libasound2 libpulse0 libudev1 libx11-xcb1 libxcb1 \
                libxkbcommon0 libwayland-client0 libwayland-cursor0 libwayland-egl1 >/dev/null
            /sgi/bin/qemu-system-mips64 --version
            /sgi/bin/qemu-img --version
            /sgi/bin/qemu-system-mips64 -M help | tee /tmp/machines
            grep -qw octane2 /tmp/machines
            /sgi/bin/qemu-system-mips64 -L help
            quit() { printf "%s\n" "{\"execute\":\"qmp_capabilities\"}" "{\"execute\":\"quit\"}"; }
            quit | /sgi/bin/qemu-system-mips64 -M none -S -display none -monitor none \
                -serial none -qmp stdio -vnc 127.0.0.1:0,password=on
            quit | /sgi/bin/qemu-system-mips64 -M none -S -display none -monitor none \
                -serial none -qmp stdio -object tls-creds-anon,id=tc0,endpoint=server \
                -vnc 127.0.0.1:0,tls-creds=tc0
            cd /tmp
            /sgi/bin/qemu-img create -f luks --object secret,id=s,data=pw \
                -o key-secret=s test.luks 1M
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-linux-x86_64
          path: build-package/dist/*
          if-no-files-found: error

  windows:
    name: Build Windows archive
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      # The runner's Git converts line endings, which breaks configure.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git base-devel autoconf-archive curl zip unzip tar
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
            mingw-w64-x86_64-cmake mingw-w64-x86_64-rust-bindgen
            mingw-w64-x86_64-clang
      # rustc is installed from rustup, pinned to RUST_VERSION, because
      # MSYS2's package rolls. rustup-init 1.29.2 is checked against the
      # SHA-256 Rust publishes for it.
      - name: install rustc ${{ env.RUST_VERSION }}
        shell: msys2 {0}
        run: |
          curl -fsSL -o rustup-init.exe https://static.rust-lang.org/rustup/archive/1.29.2/x86_64-pc-windows-gnu/rustup-init.exe
          echo "d2845ad914acf5add202100c0a7ddf19ab1c3e52521e12841bafff13888e49bb *rustup-init.exe" | sha256sum -c -
          ./rustup-init.exe -y --no-modify-path --profile minimal \
              --default-host x86_64-pc-windows-gnu --default-toolchain "$RUST_VERSION"
          rm rustup-init.exe
      - name: cache vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-package/vcpkg-binary-cache
          key: vcpkg-windows-${{ hashFiles('packaging/vcpkg.json', 'packaging/vcpkg-commit', 'packaging/triplets/x64-mingw-origami.cmake') }}
      - name: cache the GPU library's crates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry
          key: cargo-windows-${{ hashFiles('rust/sgi-gpu/Cargo.lock') }}
      - name: build the archive
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          # The MSYS2 shell does not inherit the Windows PATH, where rustup put cargo.
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          rustc --version
          python packaging/sgi-package.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - name: the Rust devices and the GPU library are built in
        shell: msys2 {0}
        run: |
          build=build-package/qemu-build
          devices=$build/mips64-softmmu-config-devices.mak
          grep '^CONFIG_X_SGI_BIC_BOARD_INTERFACE_RUST=y' "$devices"
          # A "! grep" would not fail the step, so test the status.
          if grep '^CONFIG_SGI_BIC_BOARD_INTERFACE_C=y' "$devices"; then
            echo "the C board interface was built, not the Rust one"
            exit 1
          fi
          grep '^#define CONFIG_HAVE_SGI_GPU' "$build/config-host.h"
      - name: run the archive with the MinGW toolchain off PATH
        timeout-minutes: 10
        # This step's PowerShell has none of MSYS2 on PATH, so a DLL the
        # archive should have bundled is not found.
        shell: pwsh
        run: |
          $archive = Get-ChildItem build-package/dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath unpacked
          # The DirectX Shader Compiler, and the notices and licences of the
          # Rust code, are what the Rust build adds to the archive.
          foreach ($file in 'bin\dxcompiler.dll', 'bin\dxil.dll', 'licenses\sgi-gpu.THIRD-PARTY-NOTICES.txt') {
              if (-not (Test-Path "unpacked\$file")) { throw "$file is not in the archive" }
          }
          if (-not (Get-ChildItem unpacked\licenses\rust.* -ErrorAction SilentlyContinue)) { throw "no Rust licences in the archive" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $bin = Join-Path $PWD 'unpacked\bin'
          & "$bin\qemu-system-mips64.exe" --version
          if ($LASTEXITCODE) { throw "qemu-system-mips64 --version: $LASTEXITCODE" }
          & "$bin\qemu-img.exe" --version
          if ($LASTEXITCODE) { throw "qemu-img --version: $LASTEXITCODE" }
          $machines = & "$bin\qemu-system-mips64.exe" -M help
          if ($LASTEXITCODE) { throw "-M help: $LASTEXITCODE" }
          $machines
          if (-not ($machines -match '\boctane2\b')) { throw 'octane2 is not listed' }
          & "$bin\qemu-system-mips64.exe" -L help
          # A bad option makes QEMU exit at once, so a process still running
          # after a few seconds has accepted them.
          function Test-Starts([string]$options) {
              $p = Start-Process -FilePath "$bin\qemu-system-mips64.exe" -ArgumentList "-M none -S -display none $options" -PassThru -NoNewWindow
              if ($p.WaitForExit(5000)) { throw "qemu-system-mips64 $options exited with $($p.ExitCode)" }
              $p.Kill()
              $p.WaitForExit()
          }
          # The Rust board interface, and the GPU library's test device.
          Test-Starts '-accel qtest -cpu R10000 -device sgi-bic-board-interface-fixture,id=bic,identity=0xc000'
          Test-Starts '-device x-sgi-gpu-test,id=g'
          Test-Starts '-vnc 127.0.0.1:0,password=on'
          Test-Starts '-object tls-creds-anon,id=tc0,endpoint=server -vnc 127.0.0.1:0,tls-creds=tc0'
          & "$bin\qemu-img.exe" create -f luks --object secret,id=s,data=pw -o key-secret=s "$env:RUNNER_TEMP\test.luks" 1M
          if ($LASTEXITCODE) { throw "qemu-img create -f luks: $LASTEXITCODE" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-windows-x86_64
          path: build-package/dist/*
          if-no-files-found: error

  macos:
    name: Build macOS archive
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: install build tools
        run: brew install ninja pkgconf python autoconf autoconf-archive automake libtool
      - name: cache vcpkg binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-package/vcpkg-binary-cache
          key: vcpkg-macos-${{ hashFiles('packaging/vcpkg.json', 'packaging/vcpkg-commit', 'packaging/triplets/arm64-osx-origami.cmake') }}
      # The runner's rustup only provides a current stable, and bindgen is not
      # on it. bindgen-cli builds from source, so its binary is cached with the
      # crates the GPU library fetches.
      - name: cache bindgen and the GPU library's crates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/bindgen
            ~/.cargo/registry
          key: cargo-macos-bindgen-0.73.2-${{ hashFiles('rust/sgi-gpu/Cargo.lock') }}
      - name: install rustc ${{ env.RUST_VERSION }} and bindgen
        run: |
          set -e
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup default "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # The cache restores the binary without cargo's install record, so a
          # plain install would stop on "binary already exists".
          if [ "$(bindgen --version 2>/dev/null)" != "bindgen 0.73.2" ]; then
            cargo install bindgen-cli --version 0.73.2 --locked --force
          fi
      - name: build the archive
        run: python3 packaging/sgi-package.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - name: the Rust devices and the GPU library are built in
        run: |
          set -e
          build=build-package/qemu-build
          devices=$build/mips64-softmmu-config-devices.mak
          grep '^CONFIG_X_SGI_BIC_BOARD_INTERFACE_RUST=y' "$devices"
          # A device falls back to its C copy when Rust is off, so check for
          # the C one too.
          if grep '^CONFIG_SGI_BIC_BOARD_INTERFACE_C=y' "$devices"; then
            echo "the C board interface was built, not the Rust one"
            exit 1
          fi
          grep '^#define CONFIG_HAVE_SGI_GPU' "$build/config-host.h"
      - name: run the archive
        run: |
          set -e
          mkdir unpacked
          tar -xzf build-package/dist/*.tar.gz -C unpacked
          test -f unpacked/licenses/sgi-gpu.THIRD-PARTY-NOTICES.txt
          ls unpacked/licenses/rust.*
          unpacked/bin/qemu-system-mips64 --version
          unpacked/bin/qemu-img --version
          unpacked/bin/qemu-system-mips64 -M help | tee machines.txt
          grep -qw octane2 machines.txt
          unpacked/bin/qemu-system-mips64 -L help
          quit() { printf '%s\n' '{"execute":"qmp_capabilities"}' '{"execute":"quit"}'; }
          quit | unpacked/bin/qemu-system-mips64 -M none -S -display none -monitor none \
              -serial none -qmp stdio -vnc 127.0.0.1:0,password=on
          quit | unpacked/bin/qemu-system-mips64 -M none -S -display none -monitor none \
              -serial none -qmp stdio -object tls-creds-anon,id=tc0,endpoint=server \
              -vnc 127.0.0.1:0,tls-creds=tc0
          quit | unpacked/bin/qemu-system-mips64 -M none -S -display none -monitor none \
              -serial none -qmp stdio -accel qtest -cpu R10000 \
              -device sgi-bic-board-interface-fixture,id=bic,identity=0xc000
          unpacked/bin/qemu-img create -f luks --object secret,id=s,data=pw \
              -o key-secret=s "$RUNNER_TEMP/test.luks" 1M
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-macos-arm64
          path: build-package/dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # A tag push only. The other triggers stop after the three builds.
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sgi-origami-') }}
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: write checksums and release notes
        run: |
          set -eu
          cd archives
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cd ..
          # Re-fetch the tag: a checkout can leave an annotated tag as a
          # bare ref, which has no message.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          # The tag message is the whole release body.
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > notes.md
          cat notes.md
      - name: create the draft, attach the files, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # A rerun replaces its own unpublished draft and never a Release.
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" --notes-file notes.md archives/*
          gh release edit "$RELEASE_TAG" --draft=false
